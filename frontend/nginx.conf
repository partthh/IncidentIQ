# nginx config for the built dashboard.
#
# Two jobs: serve the static bundle, and forward the API and the WebSocket to the
# backend so the browser only ever talks to one origin.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A single-page app has exactly one entry point. Without this, a refresh on
    # /incidents/<uuid> would be answered by nginx with a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are immutable by construction, so they can be cached
    # forever. index.html must not be, or a deploy never reaches a returning browser.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ingestion payloads are small, but a slow client must not hold a worker.
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # The WebSocket upgrade. The three upgrade headers below are all required: without
    # any one of them nginx serves the response over a plain HTTP connection and the
    # STOMP client hangs instead of failing, which is a miserable thing to debug.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Long-lived: the socket is expected to stay open indefinitely, and a
        # timeout here would show up as a mysterious periodic reconnect.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}